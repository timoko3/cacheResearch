name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tools
        run: |
          cmake --version
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: >
          cmake --build
          --preset ${{ matrix.preset }}
          --target general_functions cache_research_config
          --parallel

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
