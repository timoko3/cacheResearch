name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library-package:
    name: Verify standalone cache package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build without submodules
        run: |
          cmake --preset library
          cmake --build --preset library
      - name: Verify source and relocated installed consumers
        run: |
          for mode in subdirectory installed; do
            cmake \
              -DCACHE_RESEARCH_SOURCE_DIR="$GITHUB_WORKSPACE" \
              -DCACHE_RESEARCH_BINARY_DIR="$GITHUB_WORKSPACE/build/library" \
              -DCACHE_RESEARCH_GENERATOR=Ninja \
              -DCACHE_RESEARCH_CXX_COMPILER="$(command -v c++)" \
              -DCACHE_RESEARCH_CONFIG=Release \
              -DCACHE_RESEARCH_MODE="$mode" \
              -P cmake/VerifyPackage.cmake
          done

  portability:
    name: Verify (${{ matrix.os }}, CMake ${{ matrix.cmake }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            cmake: system
            generator: Visual Studio 17 2022
          - os: ubuntu-24.04
            cmake: 3.24.3
            generator: Ninja
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install minimum supported CMake
        if: matrix.cmake != 'system'
        run: |
          python3 -m venv build/cmake-tool
          & ./build/cmake-tool/bin/python -m pip install 'cmake==${{ matrix.cmake }}'
          (Resolve-Path ./build/cmake-tool/bin).Path >> $env:GITHUB_PATH
      - name: Configure complete project
        run: |
          cmake --version
          cmake -S . -B build/ci -G '${{ matrix.generator }}' -DCMAKE_BUILD_TYPE=Release -DCACHE_RESEARCH_BUILD_APP=ON -DCACHE_RESEARCH_BUILD_BENCHMARKS=ON -DCACHE_RESEARCH_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error

  benchmark-cli:
    name: Test benchmark CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test generators and command-line interface
        run: python3 -m unittest discover -s tests -p test_benchmark_cli.py -v

  format:
    name: Check C++ formatting
    if: github.event_name != 'push' || github.ref_type != 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Check formatting
        run: python3 scripts/code_quality.py format

  format-push:
    name: Check and fix C++ formatting
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Check formatting
        id: format-check
        continue-on-error: true
        run: python3 scripts/code_quality.py format
      - name: Fix formatting
        if: steps.format-check.outcome == 'failure'
        run: |
          python3 scripts/code_quality.py format-fix
          python3 scripts/code_quality.py format
      - name: Commit formatting and restart CI
        if: steps.format-check.outcome == 'failure'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Formatting check failed but the formatter produced no changes."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply clang-format 18"
          # A normal push rejects concurrent updates instead of overwriting them.
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
          # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
          gh workflow run CI.yml --ref "$BRANCH_NAME"

  tidy:
    name: Analyze C++ with clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install clang-tidy 18
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy-18 ninja-build
      - name: Configure compilation database
        run: cmake --preset debug
      - name: Analyze project sources
        run: python3 scripts/code_quality.py tidy --build-dir build/debug

  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test benchmark CLI with C++ runner
        env:
          CACHE_BENCHMARK_RUNNER: ${{ github.workspace }}/build/${{ matrix.preset }}/cache_benchmark_runner
          CACHE_EXACT_SEARCH_RUNNER: ${{ github.workspace }}/build/${{ matrix.preset }}/cache_exact_search
        run: python3 -m unittest discover -s tests -p test_benchmark_cli.py -v

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}
