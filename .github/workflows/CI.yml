name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-cli:
    name: Test benchmark CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test generators and command-line interface
        run: python3 -m unittest discover -s tests -p test_benchmark_cli.py -v

  format:
    name: Check C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - name: Check formatting
        run: python3 scripts/code_quality.py format

  tidy:
    name: Analyze C++ with clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install clang-tidy 18
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy-18 ninja-build
      - name: Configure compilation database
        run: cmake --preset debug
      - name: Analyze project sources
        run: python3 scripts/code_quality.py tidy --build-dir build/Linux/debug

  build:
    name: Build (${{ matrix.preset }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show tool versions
        run: |
          cmake --version
          ninja --version
          g++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test benchmark CLI with C++ runner
        env:
          CACHE_BENCHMARK_RUNNER: ${{ github.workspace }}/build/Linux/${{ matrix.preset }}/cache_benchmark_runner
          CACHE_EXACT_SEARCH_RUNNER: ${{ github.workspace }}/build/Linux/${{ matrix.preset }}/cache_exact_search
        run: python3 -m unittest discover -s tests -p test_benchmark_cli.py -v

      - name: Run tests
        run: ctest --test-dir build/Linux/${{ matrix.preset }} --output-on-failure --no-tests=error
